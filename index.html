<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Jeux en Ligne</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f0f0f0;
    margin: 0;
    padding: 40px 20px;
  }
  h1 { margin-bottom: 10px; color: #333; }
  p.subtitle { color: #666; margin-bottom: 40px; }
  #game-list {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .game-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    padding: 24px;
    width: 220px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .game-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
  }
  .game-icon { font-size: 48px; margin-bottom: 12px; }
  .game-title { font-weight: bold; font-size: 18px; margin-bottom: 6px; }
  .game-desc { font-size: 13px; color: #777; }
</style>
</head>
<body>
  <h1>🎮 Mes Jeux en Ligne</h1>
  <p class="subtitle">Choisis un jeu et joue à deux, à distance</p>
  <div id="game-list">
    <a class="game-card" href="dames.html">
      <div class="game-icon">⚫⚪</div>
      <div class="game-title">Jeu de Dames</div>
      <div class="game-desc">Le grand classique, 8x8, avec prise et promotion</div>
    </a>
    <a class="game-card" href="morpion.html">
      <div class="game-icon">✖️⭕</div>
      <div class="game-title">Morpion</div>
      <div class="game-desc">Rapide et simple, 3x3, premier à aligner 3</div>
    </a>
  </div>
</body>
</html>
