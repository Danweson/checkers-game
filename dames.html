<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeu de Dames en Ligne</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f0f0f0;
    margin: 0;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; }
  a.back-link {
    margin-bottom: 15px;
    color: #4CAF50;
    text-decoration: none;
    font-weight: bold;
  }
  a.back-link:hover { text-decoration: underline; }
  #controls {
    margin-bottom: 20px;
    padding: 15px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  input, button {
    padding: 8px 12px;
    font-size: 14px;
  }
  button {
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background-color: #45a049; }
  #status {
    font-weight: bold;
    margin-bottom: 15px;
    color: #333;
  }
  #board {
    width: 400px;
    height: 400px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border: 4px solid #333;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .cell {
    width: 50px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .cell.white { background-color: #ffce9e; }
  .cell.black { background-color: #d18b47; }
  .cell.selected { background-color: #769656; }
  .piece {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
  }
  .piece.player1 {
    background-color: #ffffff;
    border: 3px solid #333;
    color: #333;
  }
  .piece.player2 {
    background-color: #333333;
    border: 3px solid #000;
    color: #fff;
  }
  .piece.king::after {
    content: "★";
    font-size: 16px;
  }
</style>
</head>
<body>
  <a class="back-link" href="index.html">&larr; Retour à l'accueil</a>
  <h1>Jeu de Dames à distance</h1>
  <div id="controls">
    <button onclick="createGame()">Créer une partie</button>
    <span>ou</span>
    <input type="text" id="join-id" placeholder="Entrer l'ID de partie">
    <button onclick="joinGame()">Rejoindre</button>
  </div>
  <div id="status">Statut : Non connecté</div>
  <div id="board"></div>
<script>
  const BOARD_SIZE = 8;
  let boardState = [];
  let selectedPiece = null;
  let peer = null;
  let conn = null;
  let myColor = null; // 'player1' (Blanc) ou 'player2' (Noir)
  let currentTurn = 'player1';

  function initBoard() {
    boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        if ((r + c) % 2 === 1) {
          if (r < 3) boardState[r][c] = { player: 'player2', isKing: false };
          else if (r > 4) boardState[r][c] = { player: 'player1', isKing: false };
        }
      }
    }
    renderBoard();
  }

  function renderBoard() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = `cell ${(r + c) % 2 === 0 ? 'white' : 'black'}`;
        cell.dataset.row = r;
        cell.dataset.col = c;
        if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
          cell.classList.add('selected');
        }
        const pieceData = boardState[r][c];
        if (pieceData) {
          const piece = document.createElement('div');
          piece.className = `piece ${pieceData.player} ${pieceData.isKing ? 'king' : ''}`;
          cell.appendChild(piece);
        }
        cell.addEventListener('click', () => handleCellClick(r, c));
        boardEl.appendChild(cell);
      }
    }
  }

  function handleCellClick(r, c) {
    if (!conn) {
      alert("Connectez-vous avec un autre joueur pour jouer !");
      return;
    }
    if (currentTurn !== myColor) return;

    const piece = boardState[r][c];
    if (piece && piece.player === myColor) {
      selectedPiece = { r, c };
      renderBoard();
      return;
    }
    if (selectedPiece && !piece) {
      if (isValidMove(selectedPiece.r, selectedPiece.c, r, c)) {
        executeMove(selectedPiece.r, selectedPiece.c, r, c);
        selectedPiece = null;
        currentTurn = currentTurn === 'player1' ? 'player2' : 'player1';
        updateStatus();
        renderBoard();
        sendGameState();
      }
    }
  }

  function isValidMove(fromR, fromC, toR, toC) {
    const piece = boardState[fromR][fromC];
    const dir = piece.player === 'player1' ? -1 : 1;
    const rowDiff = toR - fromR;
    const colDiff = Math.abs(toC - fromC);
    if (colDiff === 1 && (piece.isKing ? Math.abs(rowDiff) === 1 : rowDiff === dir)) {
      return true;
    }
    if (colDiff === 2 && (piece.isKing ? Math.abs(rowDiff) === 2 : rowDiff === 2 * dir)) {
      const midR = (fromR + toR) / 2;
      const midC = (fromC + toC) / 2;
      const midPiece = boardState[midR][midC];
      if (midPiece && midPiece.player !== piece.player) {
        return true;
      }
    }
    return false;
  }

  function executeMove(fromR, fromC, toR, toC) {
    const piece = boardState[fromR][fromC];
    boardState[toR][toC] = piece;
    boardState[fromR][fromC] = null;
    if (Math.abs(toR - fromR) === 2) {
      const midR = (fromR + toR) / 2;
      const midC = (fromC + toC) / 2;
      boardState[midR][midC] = null;
    }
    if ((piece.player === 'player1' && toR === 0) || (piece.player === 'player2' && toR === 7)) {
      piece.isKing = true;
    }
  }

  function createGame() {
    peer = new Peer();
    peer.on('open', (id) => {
      myColor = 'player1';
      document.getElementById('status').innerText = `ID de partie : ${id} (Partagez cet ID)`;
    });
    peer.on('connection', (connection) => {
      conn = connection;
      setupConnection();
    });
  }

  function joinGame() {
    const joinId = document.getElementById('join-id').value;
    if (!joinId) return alert("Veuillez entrer un ID de partie.");
    peer = new Peer();
    peer.on('open', () => {
      myColor = 'player2';
      conn = peer.connect(joinId);
      setupConnection();
    });
  }

  function setupConnection() {
    conn.on('open', () => {
      updateStatus();
      if (myColor === 'player1') sendGameState();
    });
    conn.on('data', (data) => {
      boardState = data.boardState;
      currentTurn = data.currentTurn;
      updateStatus();
      renderBoard();
    });
  }

  function sendGameState() {
    if (conn && conn.open) {
      conn.send({ boardState, currentTurn });
    }
  }

  function updateStatus() {
    const turnText = currentTurn === myColor ? "À VOTRE TOUR" : "Tour de l'adversaire";
    const colorText = myColor === 'player1' ? "Blancs" : "Noirs";
    document.getElementById('status').innerText = `Connecté ! Vous jouez les ${colorText}. (${turnText})`;
  }

  initBoard();
</script>
</body>
</html>
